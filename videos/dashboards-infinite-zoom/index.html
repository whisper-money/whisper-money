            (() => {
                const declared = JSON.parse(
                    document.documentElement.dataset.compositionVariables,

                const defaults = Object.fromEntries(

                );
                const v = {
                    ...defaults,
                    ...(window.__hyperframes?.getVariables?.() ?? {}),

                const $ = (selector) => document.querySelector(selector);

                /** Words as spans, so a line can arrive word by word. */

                    element.textContent = '';
                    for (const word of text.split(' ')) {
                        const span = document.createElement('span');
                        span.className = 'word';
                        const bare = word.replace(/[^\p{L}]/gu, '');
                        if (accent && bare === accent) {
                            // Only the word takes the accent, not its punctuation.
                            const [before, after] = word.split(bare);
                            const mark = document.createElement('span');
                            mark.className = 'accent';
                            mark.textContent = bare;
                            span.append(before, mark, after);
                        } else {
                            span.textContent = word;
                        }
                        element.append(span);
                    }
                    return [...element.children];
                };

                const CHECK =
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

                const W = 1500 / 552; // capture CSS px -> drawn px
                const WIDGET = { left: 210, top: 192 };
                const CENTER = { x: 960, y: 540 };

                /** Push the camera into point (x, y) of a widget, in its capture's CSS px. */
                const dive = (
                    tl,
                    selector,
                    point,
                    start,
                    duration,
                    scale = 26,
                ) => {
                    const origin = { x: point.x * W, y: point.y * W };
                    tl.set(
                        selector,
                        { transformOrigin: `${origin.x}px ${origin.y}px` },
                        0,
                    );
                    tl.fromTo(
                        selector,
                        { scale: 1, x: 0, y: 0 },
                        {
                            scale,
                            x: CENTER.x - (WIDGET.left + origin.x),
                            y: CENTER.y - (WIDGET.top + origin.y),
                            duration,
                            ease: 'power3.in',
                        },
                        start,
                    );
                };

                const tl = gsap.timeline({ paused: true });
                const ground = (color, at, duration = 0, from = null) =>
                    duration === 0
                        ? tl.set('#ground', { backgroundColor: color }, at)
                        : tl.fromTo(
                              '#ground',
                              { backgroundColor: from },
                              {
                                  backgroundColor: color,
                                  duration,
                                  ease: 'power2.inOut',
                                  immediateRender: false,
                              },
                              at,
                          );

                ground('#e4e4e7', 0);

                // Hook: the weekly shop widget, then into its tallest bar.
                dive(tl, '#hook-zoom', { x: 349.5, y: 185 }, 0.4, 1.2);
                ground('#00bc7d', 1.55);

                const cycles = [
                    {
                        n: 1,
                        start: 1.6,
                        card: 3.9,
                        code: 4.4,
                        gap: 0.2,
                        land: 6.3,
                        diveAt: 8.1,
                        diveEnd: 9.0,
                        target: { x: 349.5, y: 175.5 },
                        next: '#fe9a00',
                    },
                    {
                        n: 2,
                        start: 9.0,
                        card: 10.8,
                        code: 11.2,
                        gap: 0.15,
                        land: 12.6,
                        diveAt: 14.2,
                        diveEnd: 15.0,
                        target: { x: 250, y: 190 },
                        next: '#d5e5ff',
                    },
                    {
                        n: 3,
                        start: 15.0,
                        card: 16.7,
                        code: 17.0,
                        gap: 0.125,
                        land: 18.2,
                        diveAt: null,
                        diveEnd: null,
                    },
                ];

                for (const c of cycles) {
                    const p = `#c${c.n}`;
                    const name = v[`ask_${c.n}_name`];
                    $(`${p}-name`).textContent = name;
                    $(`${p}-avatar`).textContent = name.charAt(0);
                    const askWords = words($(`${p}-bubble`), v[`ask_${c.n}`]);
                    $(`${p}-card .agent-name`).textContent = v.agent;
                    $(`${p}-card .doing`).textContent = `· ${v.agent_doing}`;
                    $(`${p}-placed`).innerHTML = `${CHECK}<span></span>`;
                    $(`${p}-placed span`).textContent = v.placed;
                    const code = $(`${p}-code`);
                    code.textContent = '';
                    const lines = v[`code_${c.n}`].split('\n').map((text) => {
                        const line = document.createElement('span');
                        line.className = 'line';
                        line.textContent = text;
                        code.append(line);
                        return line;
                    });

                    // The ask grows out of the point the camera dove into.
                    tl.fromTo(
                        `${p}-ask-box`,
                        { scale: 0.4, opacity: 0 },
                        {
                            scale: 1,
                            opacity: 1,
                            duration: 0.5,
                            ease: 'back.out(1.2)',
                        },
                        c.start + 0.02,
                    );
                    tl.fromTo(
                        askWords,
                        { opacity: 0, filter: 'blur(6px)' },
                        {
                            opacity: 1,
                            filter: 'blur(0px)',
                            duration: 0.13,
                            stagger: 0.067,
                            ease: 'power2.out',
                        },
                        c.start + 0.15,
                    );

                    // It rises; the agent's card opens under it and types the widget.
                    tl.fromTo(
                        `${p}-ask-box`,
                        { y: 0, scale: 1 },
                        {
                            y: -330,
                            scale: 0.72,
                            duration: 0.5,
                            ease: 'power2.inOut',
                            immediateRender: false,
                        },
                        c.card,
                    );
                    tl.fromTo(
                        `${p}-card`,
                        { y: 90, opacity: 0, scale: 0.96 },
                        {
                            y: 0,
                            opacity: 1,
                            scale: 1,
                            duration: 0.5,
                            ease: 'expo.out',
                        },
                        c.card + 0.08,
                    );
                    tl.fromTo(
                        lines,
                        { clipPath: 'inset(0 100% 0 0)' },
                        {
                            clipPath: 'inset(0 0% 0 0)',
                            duration: 0.16,
                            stagger: c.gap,
                            ease: 'none',
                        },
                        c.code,
                    );

                    // The card becomes the widget it wrote.
                    tl.fromTo(
                        lines,
                        { opacity: 1, filter: 'blur(0px)' },
                        {
                            opacity: 0,
                            filter: 'blur(8px)',
                            duration: 0.18,
                            ease: 'power2.in',
                            immediateRender: false,
                        },
                        c.land - 0.05,
                    );
                    tl.fromTo(
                        `${p}-card`,
                        { scale: 1, opacity: 1 },
                        {
                            scale: 0.92,
                            opacity: 0,
                            duration: 0.25,
                            ease: 'power3.in',
                            immediateRender: false,
                        },
                        c.land,
                    );
                    tl.fromTo(
                        `${p}-ask-box`,
                        { opacity: 1, filter: 'blur(0px)' },
                        {
                            opacity: 0,
                            filter: 'blur(8px)',
                            duration: 0.2,
                            ease: 'power2.in',
                            immediateRender: false,
                        },
                        c.land,
                    );
                    tl.fromTo(
                        `${p}-zoom`,
                        {
                            clipPath: 'inset(100% 0% 0% 0% round 26px)',
                            scale: 0.96,
                        },
                        {
                            clipPath: 'inset(0% 0% 0% 0% round 26px)',
                            scale: 1,
                            duration: 0.55,
                            ease: 'expo.out',
                        },
                        c.land + 0.05,
                    );
                    tl.fromTo(
                        `${p}-placed`,
                        { opacity: 0, filter: 'blur(6px)' },
                        {
                            opacity: 1,
                            filter: 'blur(0px)',
                            duration: 0.2,
                            ease: 'power2.out',
                        },
                        c.land + 0.6,
                    );

                    if (c.diveAt !== null) {
                        tl.fromTo(
                            `${p}-placed`,
                            { opacity: 1 },
                            {
                                opacity: 0,
                                duration: 0.15,
                                ease: 'power2.in',
                                immediateRender: false,
                            },
                            c.diveAt,
                        );
                        dive(
                            tl,
                            `${p}-zoom`,
                            c.target,
                            c.diveAt,
                            c.diveEnd - c.diveAt,
                        );
                        ground(c.next, c.diveEnd - 0.05);
                    }
                }

                // Pull back: the kids widget is the same pixels as its cell in the
                // dashboard (280, 446, 552 x 256 CSS px of a 1440 x 810 capture).
                const D = 1920 / 1440;
                const cell = { x: 280 * D, y: 446 * D, width: 552 * D };
                const s = 1500 / cell.width;
                tl.fromTo(
                    '#c3-placed',
                    { opacity: 1 },
                    {
                        opacity: 0,
                        duration: 0.15,
                        ease: 'power2.in',
                        immediateRender: false,
                    },
                    19.6,
                );
                tl.fromTo(
                    '#dash',
                    {
                        scale: s,
                        x: WIDGET.left - cell.x * s,
                        y: WIDGET.top - cell.y * s,
                        borderRadius: 26 / s,
                    },
                    {
                        scale: 0.88,
                        x: 1920 * 0.06,
                        y: 1080 * 0.06,
                        borderRadius: 22,
                        duration: 1.6,
                        ease: 'power2.inOut',
                    },
                    19.8,
                );

                // The dashboard leaves; the ground floods to the app's own dark.
                tl.fromTo(
                    '#dash',
                    {
                        scale: 0.88,
                        x: 1920 * 0.06,
                        y: 1080 * 0.06,
                        opacity: 1,
                        filter: 'blur(0px)',
                    },
                    {
                        scale: 0.8,
                        x: 1920 * 0.1,
                        y: 1080 * 0.1,
                        opacity: 0,
                        filter: 'blur(8px)',
                        duration: 0.35,
                        ease: 'power3.in',
                        immediateRender: false,
                    },
                    23.6,
                );
                ground('#1f1f1f', 23.55, 0.4, '#d5e5ff');

                // Claim, word by word, then held still.
                const claimWords = [
                    ...words($('#claim-a'), v.claim_a, v.claim_accent),
                    ...words($('#claim-b'), v.claim_b, v.claim_accent),
                ];
                tl.fromTo(
                    claimWords,
                    { opacity: 0, filter: 'blur(6px)' },
                    {
                        opacity: 1,
                        filter: 'blur(0px)',
                        duration: 0.13,
                        stagger: 0.067,
                        ease: 'power2.out',
                    },
                    23.95,
                );
                tl.fromTo(
                    claimWords,
                    { opacity: 1, filter: 'blur(0px)' },
                    {
                        opacity: 0,
                        filter: 'blur(8px)',
                        duration: 0.18,
                        ease: 'power2.in',
                        immediateRender: false,
                    },
                    26.2,
                );
                $('#claim-2').textContent = v.claim_2;
                tl.fromTo(
                    '#claim-2',
                    { opacity: 0, filter: 'blur(8px)' },
                    {
                        opacity: 1,
                        filter: 'blur(0px)',
                        duration: 0.2,
                        ease: 'power2.out',
                    },
                    26.38,
                );
                tl.fromTo(
                    '#claim-2',
                    { opacity: 1, filter: 'blur(0px)' },
                    {
                        opacity: 0,
                        filter: 'blur(8px)',
                        duration: 0.18,
                        ease: 'power2.in',
                        immediateRender: false,
                    },
                    28.42,
                );

                // End card: the mark fills up, the name wipes in beside it.
                ground('#f4f4f5', 28.45, 0.4, '#1f1f1f');
                $('#tagline').textContent = v.tagline;
                $('#cta').textContent = v.cta;
                $('#note').textContent = v.note;
                tl.fromTo(
                    '#logo',
                    { clipPath: 'inset(100% 0% 0% 0% round 30px)', scale: 0.9 },
                    {
                        clipPath: 'inset(0% 0% 0% 0% round 30px)',
                        scale: 1,
                        duration: 0.5,
                        ease: 'expo.out',
                    },
                    28.65,
                );
                tl.fromTo(
                    '#wordmark',
                    { clipPath: 'inset(0% 100% 0% 0%)' },
                    {
                        clipPath: 'inset(0% 0% 0% 0%)',
                        duration: 0.45,
                        ease: 'power3.out',
                    },
                    29.1,
                );
                tl.fromTo(
                    '#tagline',
                    { opacity: 0, filter: 'blur(8px)' },
                    {
                        opacity: 1,
                        filter: 'blur(0px)',
                        duration: 0.2,
                        ease: 'power2.out',
                    },
                    29.7,
                );
                tl.fromTo(
                    '#cta',
                    { opacity: 0, y: 24 },
                    { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' },
                    30.1,
                );
                tl.fromTo(
                    '#note',
                    { opacity: 0 },
                    { opacity: 1, duration: 0.3, ease: 'power2.out' },
                    30.2,
                );

                window.__timelines = window.__timelines || {};
                window.__timelines['main'] = tl;
            })();
        </script>
    </body>
</html>
