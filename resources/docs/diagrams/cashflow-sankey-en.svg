<svg viewBox="0 0 720 384" role="img" aria-labelledby="cashflow-sankey-en-title cashflow-sankey-en-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="cashflow-sankey-en-title">How a period's income splits</title>
    <desc id="cashflow-sankey-en-desc">Income for the period splits between expenses, money saved, money invested and what is left available, and the available part splits between what open budgets still reserve and what is free. Band width is the amount.</desc>
    <text class="dg-eyebrow" x="200" y="24" text-anchor="end">COMES IN</text>
    <text class="dg-eyebrow" x="406" y="24" text-anchor="middle">SPLITS</text>
    <text class="dg-eyebrow" x="600" y="24">IS LEFT</text>
    <path class="dg-band" d="M200,80 C300,80 300,60 400,60 L400,168 C300,168 300,188 200,188 Z"/>
    <path class="dg-band-accent" d="M200,188 C300,188 300,180 400,180 L400,207 C300,207 300,215 200,215 Z"/>
    <path class="dg-band-accent" d="M200,215 C300,215 300,219 400,219 L400,237 C300,237 300,233 200,233 Z"/>
    <path class="dg-band-accent" d="M200,233 C300,233 300,249 400,249 L400,276 C300,276 300,260 200,260 Z"/>
    <path class="dg-band" d="M412,249 C506,249 506,236 600,236 L600,247 C506,247 506,260 412,260 Z"/>
    <path class="dg-band-accent" d="M412,260 C506,260 506,262 600,262 L600,278 C506,278 506,276 412,276 Z"/>
    <rect class="dg-bar" x="188" y="80" width="12" height="180"/>
    <rect class="dg-bar" x="400" y="60" width="12" height="108"/>
    <rect class="dg-bar-accent" x="400" y="180" width="12" height="27"/>
    <rect class="dg-bar-accent" x="400" y="219" width="12" height="18"/>
    <rect class="dg-bar-accent" x="400" y="249" width="12" height="27"/>
    <rect class="dg-bar" x="600" y="236" width="12" height="11"/>
    <rect class="dg-bar-accent" x="600" y="262" width="12" height="16"/>
    <text class="dg-name" x="180" y="168" text-anchor="end">Income</text>
    <text class="dg-sub" x="180" y="180" text-anchor="end">3,000</text>
    <text class="dg-name" x="420" y="112">Expenses</text>
    <text class="dg-sub" x="420" y="124">1,800</text>
    <text class="dg-name" x="420" y="192">Saved</text>
    <text class="dg-sub" x="420" y="204">450</text>
    <text class="dg-name" x="420" y="227">Invested</text>
    <text class="dg-sub" x="420" y="239">300</text>
    <text class="dg-name" x="406" y="294" text-anchor="middle">Available</text>
    <text class="dg-sub" x="406" y="306" text-anchor="middle">450</text>
    <text class="dg-name" x="620" y="238">Reserved</text>
    <text class="dg-sub" x="620" y="250">180</text>
    <text class="dg-name" x="620" y="272">Free</text>
    <text class="dg-sub" x="620" y="284">270</text>
    <line class="dg-hairline" x1="24" y1="324" x2="696" y2="324"/>
    <text class="dg-eyebrow" x="24" y="344">LEGEND</text>
    <rect class="dg-band" x="96" y="336" width="16" height="8" rx="1"/>
    <text class="dg-edge-label" x="120" y="344">WIDTH = AMOUNT</text>
    <rect class="dg-band-accent" x="288" y="336" width="16" height="8" rx="1"/>
    <text class="dg-edge-label" x="312" y="344">WHAT YOU KEEP</text>
    <text class="dg-aside" x="24" y="368">Available = income − expenses − saved − invested. Free = available − reserved. Example figures.</text>
</svg>
