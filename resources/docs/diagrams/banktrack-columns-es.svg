    <rect class="dg-node" x="440" y="250" width="200" height="22" rx="4"/>
    <text class="dg-name" x="452" y="265">Sin duplicados</text>
    <path class="dg-edge" d="M280,291 H436" marker-end="url(#banktrack-columns-es-arrow)"/>
    <rect class="dg-mask" x="80" y="280" width="200" height="22" rx="4"/>
