    <rect class="dg-mask" x="80" y="70" width="200" height="22" rx="4"/>
    <rect class="dg-node-soft" x="80" y="70" width="200" height="22" rx="4"/>
    <text class="dg-sub" x="92" y="84">Concepto</text>
