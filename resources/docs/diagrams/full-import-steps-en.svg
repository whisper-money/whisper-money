<svg viewBox="0 0 720 208" role="img" aria-labelledby="full-import-steps-en-title full-import-steps-en-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="full-import-steps-en-title">The seven steps of a full import</title>
    <desc id="full-import-steps-en-desc">Upload the file, say what to do with the data you already have, check the columns, decide what happens to each account and category, review, and import in the background. Nothing is saved before the last step, and the import can be undone from Settings.</desc>
    <line class="dg-edge" x1="72" y1="104" x2="648" y2="104"/>
    <text class="dg-name" x="72" y="52" text-anchor="middle">File</text>
    <text class="dg-sub" x="72" y="64" text-anchor="middle">Banktrack or any CSV</text>
    <circle class="dg-station" cx="72" cy="104" r="16"/>
    <text class="dg-station-number dg-station-number" x="72" y="107" text-anchor="middle">1</text>
    <text class="dg-name" x="168" y="148" text-anchor="middle">Your data</text>
    <text class="dg-sub" x="168" y="160" text-anchor="middle">only if you have some</text>
    <circle class="dg-station" cx="168" cy="104" r="16"/>
    <text class="dg-station-number dg-station-number" x="168" y="107" text-anchor="middle">2</text>
    <text class="dg-name" x="264" y="52" text-anchor="middle">Columns</text>
    <text class="dg-sub" x="264" y="64" text-anchor="middle">date · amount · account</text>
    <circle class="dg-station" cx="264" cy="104" r="16"/>
    <text class="dg-station-number dg-station-number" x="264" y="107" text-anchor="middle">3</text>
    <text class="dg-name" x="360" y="148" text-anchor="middle">Accounts</text>
    <text class="dg-sub" x="360" y="160" text-anchor="middle">new, yours or merged</text>
    <circle class="dg-station" cx="360" cy="104" r="16"/>
    <text class="dg-station-number dg-station-number" x="360" y="107" text-anchor="middle">4</text>
    <text class="dg-name" x="456" y="52" text-anchor="middle">Categories</text>
    <text class="dg-sub" x="456" y="64" text-anchor="middle">matched or created</text>
    <circle class="dg-station" cx="456" cy="104" r="16"/>
    <text class="dg-station-number dg-station-number" x="456" y="107" text-anchor="middle">5</text>
    <text class="dg-name" x="552" y="148" text-anchor="middle">Review</text>
    <text class="dg-sub" x="552" y="160" text-anchor="middle">what will be created</text>
    <circle class="dg-station-focal" cx="552" cy="104" r="16"/>
    <text class="dg-station-number-focal dg-station-number" x="552" y="107" text-anchor="middle">6</text>
    <text class="dg-name" x="648" y="52" text-anchor="middle">Import</text>
    <text class="dg-sub" x="648" y="64" text-anchor="middle">in the background</text>
    <circle class="dg-station" cx="648" cy="104" r="16"/>
    <text class="dg-station-number dg-station-number" x="648" y="107" text-anchor="middle">7</text>
    <text class="dg-aside" x="24" y="188">Nothing is saved before the last step, and every import can be undone from Settings.</text>
</svg>
