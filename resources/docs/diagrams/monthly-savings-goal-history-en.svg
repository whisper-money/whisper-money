<svg viewBox="0 0 720 304" role="img" aria-labelledby="monthly-savings-goal-history-en-title monthly-savings-goal-history-en-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="monthly-savings-goal-history-en-title">A monthly savings goal, month by month</title>
    <desc id="monthly-savings-goal-history-en-desc">Seven months of a monthly goal. April was a partial month, because the goal was created in its last days: it shows the 120 saved, with no target and no verdict. May saved 320 against a 300 target and was met; June saved exactly 300 and was met; July saved 210 and was missed by 90. From August the target was edited to 350, which left earlier months at 300: August saved 380 and September 360, both met. October is still in progress at 150 of 350. That makes 4 of 5 judged months met, a current streak of 2, and an overall difference of minus 30.</desc>
    <text class="dg-eyebrow" x="24" y="16">SAVED EACH MONTH</text>
    <text class="dg-eyebrow" x="696" y="16" text-anchor="end">4 OF 5 MET · STREAK 2 · OVERALL −30</text>
