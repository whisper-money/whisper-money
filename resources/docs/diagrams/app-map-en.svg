    <rect class="dg-node-soft" x="24" y="32" width="672" height="296" rx="10"/>
    <rect class="dg-node" x="36" y="44" width="144" height="272" rx="6"/>
    <rect class="dg-band" x="48" y="58" width="120" height="24" rx="4"/>
    <text class="dg-name" x="60" y="74">Dashboard</text>
    <rect class="dg-band" x="48" y="90" width="120" height="24" rx="4"/>
