    <text class="dg-name" x="108" y="294" text-anchor="middle">Account menu</text>
    <rect class="dg-node" x="204" y="44" width="480" height="40" rx="6"/>
    <rect class="dg-node-soft" x="406" y="52" width="87" height="24" rx="12"/>
    <text class="dg-sub" x="449" y="67" text-anchor="middle">Visit streak</text>
    <rect class="dg-node-soft" x="501" y="52" width="37" height="24" rx="12"/>
