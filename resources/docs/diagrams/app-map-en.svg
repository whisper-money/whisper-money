    <text class="dg-eyebrow" x="232" y="160">ACCOUNT MENU</text>
    <line class="dg-hairline" x1="232" y1="166" x2="420" y2="166"/>
    <path class="dg-edge" d="M168,290 H226" marker-end="url(#app-map-en-arrow)"/>
    <rect class="dg-mask" x="232" y="174" width="188" height="140" rx="6"/>
