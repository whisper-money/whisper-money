<svg viewBox="0 0 720 380" role="img" aria-labelledby="app-map-en-title app-map-en-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="app-map-en-title">Where things are in Whisper Money</title>
    <desc id="app-map-en-desc">A sketch of the app window. The sidebar on the left holds the five main screens: Dashboard, Cashflow, Accounts, Transactions and Planning. The header along the top has the visit streak, the add transaction button and Import transactions. The account menu at the bottom of the sidebar opens Progress, Monthly summaries, privacy mode, Settings and Documentation; Settings holds bank accounts and connections, automation rules, categories, labels, the AI Connector and your profile, notifications and plan.</desc>
    <defs>
        <marker id="app-map-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon class="dg-arrowhead" points="0 0, 8 3, 0 6"/>
        </marker>
    </defs>
