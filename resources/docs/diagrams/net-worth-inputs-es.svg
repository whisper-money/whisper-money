    <text class="dg-name" x="360" y="133" text-anchor="middle">Patrimonio neto</text>
    <text class="dg-sub" x="360" y="150" text-anchor="middle">en tu moneda</text>
    <rect class="dg-mask" x="546" y="40" width="150" height="44" rx="6"/>
    <rect class="dg-node" x="546" y="40" width="150" height="44" rx="6"/>
