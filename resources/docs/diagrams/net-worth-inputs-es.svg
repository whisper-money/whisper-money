<svg viewBox="0 0 720 284" role="img" aria-labelledby="net-worth-inputs-es-title net-worth-inputs-es-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="net-worth-inputs-es-title">Qué entra en el patrimonio neto</title>
    <desc id="net-worth-inputs-es-desc">Las cuentas corrientes, de ahorro, inversión, jubilación y otras siempre suman su saldo al patrimonio neto. Los inmuebles suman su valor de mercado y los préstamos restan lo que debes, pero solo si los incluyes; los dos empiezan desactivados para los usuarios nuevos. Las tarjetas de crédito nunca cuentan.</desc>
    <defs>
        <marker id="net-worth-inputs-es-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon class="dg-arrowhead" points="0 0, 8 3, 0 6"/>
        </marker>
    </defs>
    <text class="dg-eyebrow" x="24" y="16">SIEMPRE SUMA</text>
    <line class="dg-hairline" x1="24" y1="24" x2="174" y2="24"/>
    <text class="dg-eyebrow" x="285" y="16">EL TOTAL</text>
    <line class="dg-hairline" x1="285" y1="24" x2="435" y2="24"/>
    <text class="dg-eyebrow" x="546" y="16">SOLO SI LO INCLUYES</text>
    <line class="dg-hairline" x1="546" y1="24" x2="696" y2="24"/>
    <text class="dg-eyebrow" x="546" y="172">NUNCA CUENTA</text>
    <line class="dg-hairline" x1="546" y1="180" x2="696" y2="180"/>
    <path class="dg-edge" d="M220,56 V216"/>
    <path class="dg-edge" d="M220,136 H281" marker-end="url(#net-worth-inputs-es-arrow)"/>
    <path class="dg-edge dg-edge-dashed" d="M546,62 H500 Q492,62 492,70 V120 Q492,128 484,128 H439" marker-end="url(#net-worth-inputs-es-arrow)"/>
    <path class="dg-edge dg-edge-dashed" d="M546,118 H520 Q512,118 512,126 V142 Q512,150 504,150 H439" marker-end="url(#net-worth-inputs-es-arrow)"/>
    <path class="dg-edge" d="M174,56 H220"/>
