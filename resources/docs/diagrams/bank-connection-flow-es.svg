<svg viewBox="0 0 720 300" role="img" aria-labelledby="bank-connection-flow-es-title bank-connection-flow-es-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="bank-connection-flow-es-title">Cómo una conexión mantiene una cuenta al día</title>
    <desc id="bank-connection-flow-es-desc">Dos caminos. Un banco: lo eliges, das acceso de lectura en la web del propio banco, eliges qué cuentas sincronizar y cada seis horas una sincronización trae transacciones y saldos; cuando el permiso caduca, reconectas y vuelves a darlo. Un bróker o un exchange de criptomonedas: pegas una clave API de solo lectura, que se comprueba en el momento, eliges las cuentas y cada seis horas una sincronización trae saldos, no transacciones.</desc>
    <defs>
        <marker id="bank-connection-flow-es-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon class="dg-arrowhead" points="0 0, 8 3, 0 6"/>
        </marker>
    </defs>
    <text class="dg-eyebrow" x="24" y="16">CONECTAR</text>
    <line class="dg-hairline" x1="24" y1="24" x2="136" y2="24"/>
    <text class="dg-eyebrow" x="164" y="16">AUTORIZAR</text>
    <line class="dg-hairline" x1="164" y1="24" x2="276" y2="24"/>
    <text class="dg-eyebrow" x="304" y="16">ELEGIR</text>
    <line class="dg-hairline" x1="304" y1="24" x2="416" y2="24"/>
    <text class="dg-eyebrow" x="444" y="16">SINCRONIZAR</text>
    <line class="dg-hairline" x1="444" y1="24" x2="556" y2="24"/>
    <text class="dg-eyebrow" x="584" y="16">RESULTADO</text>
    <line class="dg-hairline" x1="584" y1="24" x2="696" y2="24"/>
    <path class="dg-edge" d="M136,108 H164" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M276,108 H304" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M416,108 H444" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M556,108 H584" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M136,224 H164" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M276,224 H304" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M416,224 H444" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge" d="M556,224 H584" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <path class="dg-edge dg-edge-dashed" d="M500,80 V60 Q500,52 492,52 H228 Q220,52 220,60 V80" marker-end="url(#bank-connection-flow-es-arrow)"/>
    <text class="dg-eyebrow" x="360" y="46" text-anchor="middle">EL PERMISO CADUCA → RECONECTAR</text>
    <rect class="dg-mask" x="24" y="80" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="24" y="80" width="112" height="56" rx="6"/>
    <text class="dg-name" x="80" y="104" text-anchor="middle">Tu banco</text>
    <text class="dg-sub" x="80" y="120" text-anchor="middle">por país</text>
    <rect class="dg-mask" x="164" y="80" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="164" y="80" width="112" height="56" rx="6"/>
    <text class="dg-name" x="220" y="104" text-anchor="middle">Permiso</text>
    <text class="dg-sub" x="220" y="120" text-anchor="middle">en tu banco</text>
    <rect class="dg-mask" x="304" y="80" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="304" y="80" width="112" height="56" rx="6"/>
    <text class="dg-name" x="360" y="104" text-anchor="middle">Mapear cuentas</text>
    <text class="dg-sub" x="360" y="120" text-anchor="middle">crear o vincular</text>
    <rect class="dg-mask" x="444" y="80" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="444" y="80" width="112" height="56" rx="6"/>
    <text class="dg-name" x="500" y="104" text-anchor="middle">Cada 6 horas</text>
    <text class="dg-sub" x="500" y="120" text-anchor="middle">o al momento</text>
    <rect class="dg-mask" x="584" y="80" width="112" height="56" rx="6"/>
    <rect class="dg-node-focal" x="584" y="80" width="112" height="56" rx="6"/>
    <text class="dg-name" x="640" y="104" text-anchor="middle">Transacciones</text>
    <text class="dg-sub" x="640" y="120" text-anchor="middle">y saldos</text>
    <rect class="dg-mask" x="24" y="196" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="24" y="196" width="112" height="56" rx="6"/>
    <text class="dg-name" x="80" y="220" text-anchor="middle">Bróker, exchange</text>
    <text class="dg-sub" x="80" y="236" text-anchor="middle">Kraken, Binance…</text>
    <rect class="dg-mask" x="164" y="196" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="164" y="196" width="112" height="56" rx="6"/>
    <text class="dg-name" x="220" y="220" text-anchor="middle">Clave API</text>
    <text class="dg-sub" x="220" y="236" text-anchor="middle">solo lectura</text>
    <rect class="dg-mask" x="304" y="196" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="304" y="196" width="112" height="56" rx="6"/>
    <text class="dg-name" x="360" y="220" text-anchor="middle">Mapear cuentas</text>
    <text class="dg-sub" x="360" y="236" text-anchor="middle">crear o vincular</text>
    <rect class="dg-mask" x="444" y="196" width="112" height="56" rx="6"/>
    <rect class="dg-node" x="444" y="196" width="112" height="56" rx="6"/>
    <text class="dg-name" x="500" y="220" text-anchor="middle">Cada 6 horas</text>
    <text class="dg-sub" x="500" y="236" text-anchor="middle">o al momento</text>
    <rect class="dg-mask" x="584" y="196" width="112" height="56" rx="6"/>
    <rect class="dg-node-focal" x="584" y="196" width="112" height="56" rx="6"/>
    <text class="dg-name" x="640" y="220" text-anchor="middle">Saldos</text>
    <text class="dg-sub" x="640" y="236" text-anchor="middle">lo que tienes</text>
    <line class="dg-hairline" x1="24" y1="168" x2="696" y2="168"/>
    <text class="dg-sub" x="24" y="280">Wise se conecta con una clave API pero también trae transacciones, como un banco.</text>
</svg>
