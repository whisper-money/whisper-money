    <text class="dg-eyebrow" x="469" y="236" text-anchor="middle">AGO</text>
    <text class="dg-name" x="469" y="252" text-anchor="middle">cumplido</text>
    <text class="dg-sub" x="469" y="266" text-anchor="middle">+30</text>
    <rect class="dg-bar-accent" x="537" y="67" width="44" height="153" rx="3"/>
