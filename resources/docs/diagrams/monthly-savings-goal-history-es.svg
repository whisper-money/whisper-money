    <text class="dg-eyebrow" x="559" y="236" text-anchor="middle">SEP</text>
    <text class="dg-name" x="559" y="252" text-anchor="middle">cumplido</text>
    <text class="dg-sub" x="559" y="266" text-anchor="middle">+10</text>
