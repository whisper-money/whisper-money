    <text class="dg-eyebrow" x="379" y="236" text-anchor="middle">JUL</text>
    <text class="dg-name" x="379" y="252" text-anchor="middle">no cumplido</text>
    <text class="dg-sub" x="379" y="266" text-anchor="middle">−90</text>
