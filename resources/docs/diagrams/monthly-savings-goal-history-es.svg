    <text class="dg-name" x="109" y="252" text-anchor="middle">parcial</text>
    <text class="dg-sub" x="109" y="266" text-anchor="middle">sin veredicto</text>
    <rect class="dg-bar-accent" x="177" y="84" width="44" height="136" rx="3"/>
