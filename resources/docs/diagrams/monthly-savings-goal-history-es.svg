    <text class="dg-eyebrow" x="199" y="236" text-anchor="middle">MAY</text>
    <text class="dg-name" x="199" y="252" text-anchor="middle">cumplido</text>
    <text class="dg-sub" x="199" y="266" text-anchor="middle">+20</text>
    <rect class="dg-bar-accent" x="267" y="92.5" width="44" height="127.5" rx="3"/>
    <text class="dg-sub" x="289" y="86.5" text-anchor="middle">300</text>
    <text class="dg-eyebrow" x="289" y="236" text-anchor="middle">JUN</text>
    <text class="dg-name" x="289" y="252" text-anchor="middle">cumplido</text>
