<svg viewBox="0 0 720 304" role="img" aria-labelledby="monthly-savings-goal-history-es-title monthly-savings-goal-history-es-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="monthly-savings-goal-history-es-title">Un objetivo de ahorro mensual, mes a mes</title>
    <desc id="monthly-savings-goal-history-es-desc">Siete meses de un objetivo mensual. Abril fue un mes parcial, porque el objetivo se creó en sus últimos días: muestra los 120 ahorrados, sin objetivo ni veredicto. Mayo ahorró 320 frente a un objetivo de 300 y se cumplió; junio ahorró justo 300 y se cumplió; julio ahorró 210 y no se cumplió por 90. Desde agosto el objetivo se editó a 350, y los meses anteriores se quedaron en 300: agosto ahorró 380 y septiembre 360, los dos cumplidos. Octubre sigue en proceso con 150 de 350. En total, 4 de 5 meses evaluados cumplidos, una racha actual de 2 y una diferencia acumulada de menos 30.</desc>
    <text class="dg-eyebrow" x="24" y="16">AHORRADO CADA MES</text>
    <text class="dg-eyebrow" x="696" y="16" text-anchor="end">4 DE 5 CUMPLIDOS · RACHA 2 · ACUMULADO −30</text>
