# Whisper Money - Production Docker Compose
#
# Quick install: curl -fsSL https://whisper.money/install.sh | bash
#
# Manual usage:
#   1. Copy .env.production.example to .env and configure
#   2. docker compose -f docker-compose.production.yml up -d
#
# Management:
#   - View logs: docker compose -f docker-compose.production.yml logs -f
#   - Stop: docker compose -f docker-compose.production.yml down
#   - Update: docker compose -f docker-compose.production.yml pull && docker compose -f docker-compose.production.yml up -d --force-recreate
#
# Documentation: https://whisper.money/docs/INSTALLATION.md

services:
  app:
    image: ${WHISPER_IMAGE:-ghcr.io/whisper-money/whisper-money:latest}
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
    volumes:
      - whisper-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - whisper-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  whisper-storage:
  whisper-mysql:
