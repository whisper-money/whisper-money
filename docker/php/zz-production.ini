; Production PHP settings, loaded after the image's conf.d defaults.

; Code never changes inside the image, and entrypoint.sh runs the artisan
; *:cache commands before supervisor starts php-fpm, so OPcache never needs to
; stat a file to see whether it changed. A deploy is a new container, which
; starts with an empty cache.
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Same reason: paths do not move while the container runs.
realpath_cache_ttl = 600
