; Overrides the image's [www] pool (www.conf, zz-docker.conf). php-fpm reads
; php-fpm.d/*.conf in name order and the last value wins, so this file must sort
; after zz-docker.conf. `listen` stays as the image sets it: nginx reaches the
; pool on 127.0.0.1:9000.
[www]
; The image default of 5 children queues every request behind five slow ones.
; Twelve workers at ~25–70 MB RSS each add up to under 1 GB, which leaves room
; on the shared 8 GB host for the queue workers, SSR, Redis and the occasional
; Chromium a worker starts for a monthly-summary card that was not pre-rendered.
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle a worker after 500 requests so a slow leak cannot grow it forever.
pm.max_requests = 500
