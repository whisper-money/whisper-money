[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
; Where Chromium lives, for the workers that photograph the monthly-summary
; cards. HOME is here for the same reason but does not reach the php-fpm
; workers, which get none of this environment — CardRenderer states it on the
; process it starts instead, and that is what makes a card render on request.
environment=PLAYWRIGHT_BROWSERS_PATH="/usr/local/playwright",HOME="/tmp"
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.log
stderr_logfile=/var/log/nginx.log

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.log

[program:memcached]
command=memcached -u www-data -m 64 -p 11211 -l 127.0.0.1 -v
autostart=true
autorestart=true
stdout_logfile=/var/log/memcached.log
stderr_logfile=/var/log/memcached.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --daemonize no
autostart=true
autorestart=true
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis.log

; Every program from here down needs MySQL (or the app booted) to stay up. They
; only count as started after 10s alive, and a high startretries keeps them
; retrying through a database restart instead of going FATAL after the default
; three attempts — supervisor waits one second longer before each new attempt,
; so 100 retries outlast an outage of well over an hour.
[program:inertia-ssr]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan inertia:start-ssr --runtime=bun'
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=100
stderr_logfile=/var/log/worker-inertia-ssr.log
stdout_logfile=/var/log/worker-inertia-ssr.log

[program:queue-worker-emails]
process_name=%(program_name)s
command=php /app/artisan queue:work database --queue=emails --sleep=1 --tries=5 --max-time=3600
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=100
redirect_stderr=true
stdout_logfile=/var/log/queue-worker-emails.log
stopwaitsecs=3600
numprocs=1

; Takes `budgets` before `default`. A new budget's backfill is what the
; budget page spins on, and every six hours `banking:sync` queues one job per
; connection on `default`: behind that burst the backfill waited twelve minutes
; and the user deleted the budget as stuck. First in line, it waits only for
; the job each worker is already running.
[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --queue=budgets,default --sleep=3 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=100
redirect_stderr=true
stdout_logfile=/var/log/queue-worker.log
stopwaitsecs=3600
numprocs=2

; Draws the monthly-summary share cards. Its own worker because one batch is a
; headless-Chromium launch plus thirty screenshots, once per reader in the
; timezone bucket: on `default` it would sit in front of transaction
; categorisation and automation rules, and on `emails` in front of the next
; reader's send.
[program:queue-worker-cards]
process_name=%(program_name)s
command=php /app/artisan queue:work database --queue=cards --sleep=5 --tries=1 --max-time=3600
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=100
redirect_stderr=true
stdout_logfile=/var/log/queue-worker-cards.log
stopwaitsecs=3600
numprocs=1

[program:queue-worker-ai]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work database --queue=ai --sleep=1 --tries=3 --max-time=3600
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=100
redirect_stderr=true
stdout_logfile=/var/log/queue-worker-ai.log
stopwaitsecs=3600
numprocs=2

[program:scheduler]
process_name=%(program_name)s
command=php /app/artisan schedule:work
user=www-data
autostart=true
autorestart=true
startsecs=10
startretries=100
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log
stopwaitsecs=60
numprocs=1
